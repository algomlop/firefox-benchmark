<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><title>js-heavy</title><style type="text/css">body{margin:0;font-family:Arial,Helvetica,sans-serif;color:#222;background:#fff}#w{max-width:900px;margin:0 auto;padding:24px}h1{font-size:28px}h2{font-size:20px;margin-top:28px}p{line-height:1.5}</style></head>
<body>
<div id="w"><h1>JavaScript pesado</h1><p id="res">calculando</p><canvas id="cv" width="640" height="340"></canvas><div id="box"></div><div style="clear:both"></div><script type="text/javascript">
var t0 = new Date().getTime();
// 1) criba de primos
var N = 3000000, sieve = [], i, j, count = 0;
for (i = 0; i <= N; i++) { sieve[i] = 1; }
for (i = 2; i * i <= N; i++) { if (sieve[i]) { for (j = i * i; j <= N; j += i) { sieve[j] = 0; } } }
for (i = 2; i <= N; i++) { if (sieve[i]) { count++; } }
// 2) cadenas
var s = '', k;
for (k = 0; k < 150000; k++) { s += String.fromCharCode(97 + k % 26); }
var parts = s.split('a').join('-').length;
// 3) DOM
var box = document.getElementById('box'), frag = document.createDocumentFragment(), d;
for (k = 0; k < 4000; k++) {
  d = document.createElement('div');
  d.style.cssText = 'float:left;width:40px;height:20px;margin:1px;background:#' + ((k * 2654435) & 0xffffff).toString(16);
  d.appendChild(document.createTextNode(k));
  frag.appendChild(d);
}
box.appendChild(frag);
// 4) canvas (si existe)
var cv = document.getElementById('cv');
if (cv && cv.getContext) {
  var ctx = cv.getContext('2d');
  for (k = 0; k < 4000; k++) {
    ctx.fillStyle = 'rgb(' + (k % 255) + ',' + ((k * 7) % 255) + ',' + ((k * 13) % 255) + ')';
    ctx.fillRect((k * 37) % 600, (k * 17) % 300, 30, 20);
  }
}
document.getElementById('res').innerHTML = 'primos: ' + count + ' / ' + parts + ' / ms: ' + (new Date().getTime() - t0);
</script></div>
</body></html>
